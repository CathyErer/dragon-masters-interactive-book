<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Book</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><small>INTERACTIVE READING</small><strong id="bookTitle">Interactive Book</strong></div><nav aria-label="Book controls"><button id="music">Music off</button><button id="language">EN / 中英</button><button id="close">Close book</button></nav></header>
<main id="cover"><p class="eyebrow">OPEN A STORY</p><h1 id="coverTitle">Interactive Book</h1><p id="coverDescription">Loading story…</p><button id="open">Open the book →</button><small id="coverCount">3 scenes</small></main>
<main id="book" hidden><aside><p class="eyebrow" id="chapterNumber"></p><h1 id="chapterTitle"></h1><p id="progress"></p><details id="readingBox"><summary id="readLabel">Read story</summary><p id="reading"></p></details><details id="journal"><summary>Evidence Journal</summary><ul id="journalItems"></ul></details><div class="bottom"><ol id="chapters"></ol><button id="restart">Restart story</button></div></aside><section id="page" aria-label="Interactive scene"><div id="stage"><img id="scene" alt=""><div id="layers"></div><div id="caption"></div></div><section id="panel"></section></section></main>
<p id="status" role="status" aria-live="polite"></p><script src="story.js"></script><script src="track-flight.js"></script><script src="app.js"></script></body></html>
